<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Navbar</title>

</head>
<STyle>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;

    background: #f7f8f8;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}

.navbar {
    width: 365px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 3px 5px;

    background: #111;

    border-radius: 30px;

    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
}

.logo {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;

    color: black;

    border-radius: 50%;

    font-size: 15px;
}

.links {
    display: flex;
    align-items: center;

    gap: 15px;
}

.links a {
    color: white;

    text-decoration: none;

    font-size: 10px;
}

.email {
    background: white;

    color: #111;

    padding: 9px 12px;

    border-radius: 20px;

    font-size: 9px;
}
</STyle>

<body>

    <nav class="navbar">

        <div class="logo">
            ◉
        </div>

        <div class="links">
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Playground</a>
            <a href="#">Resource</a>
        </div>

        <div class="email">
            ihyaet@gmail.com
        </div>

    </nav>

</body>
</html>
