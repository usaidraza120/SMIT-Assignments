<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Navbar</title>
   >
</head>
<STYle>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #1e3a5f;
    min-height: 100vh;
    padding-top: 100px;
}

.navbar {
    width: 80%;
    height: 75px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    background-color: white;

    border-radius: 15px;

    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #222;

    font-size: 22px;
    font-weight: bold;
}

.logo-circle {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    background-color: #3b82f6;
}

/* Links */

.links {
    display: flex;
    gap: 40px;
}

.links a {
    color: #333;

    text-decoration: none;

    font-size: 16px;
}

.links a:hover {
    color: #3b82f6;
}

/* Sign Up Button */

button {
    border: none;

    padding: 12px 22px;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    background-color: #3b82f6;

    cursor: pointer;
}

button:hover {
    background-color: #2563eb;
}
</STYle>

<body>

    <nav class="navbar">

        <div class="logo">
            <div class="logo-circle"></div>
            <span>Flow</span>
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">Product</a>
            <a href="#">Docs</a>
            <a href="#">Blog</a>
        </div>

        <button>Sign up</button>

    </nav>

</body>
</html>
