<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photosen - Photography</title>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: white;
    color: #111;
}


/* NAVBAR */

.navbar {
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 55px;
    background: white;
}


/* LOGO */

.logo {
    font-size: 30px;
}


/* NAV LINKS */

.nav-links {
    list-style: none;
    display: flex;
    gap: 32px;
}

.nav-links li {
    position: relative;
}

.nav-links a {
    text-decoration: none;
    color: #111;
    font-size: 13px;
}

.nav-links .active {
    color: #20c997;
}


/* DROPDOWN */

.dropdown-menu {
    position: absolute;
    top: 25px;
    left: -15px;
    width: 170px;
    background: white;
    list-style: none;
    padding: 10px 0;
    display: none;
    z-index: 100;
}

.dropdown-menu li {
    width: 100%;
}

.dropdown-menu a {
    display: block;
    padding: 10px 18px;
    color: #333;
}

.dropdown-menu a:hover {
    background: #f5f5f5;
    color: #20c997;
}

.dropdown:hover .dropdown-menu {
    display: block;
}


/* SOCIAL */

.social {
    display: flex;
    gap: 22px;
}

.social a {
    text-decoration: none;
    color: black;
    font-size: 16px;
}


/* GALLERY */

.gallery {
    padding: 0 55px;
}


/* PHOTO CARD */

.photo-card {
    width: 32%;
    height: 525px;
    position: relative;
    overflow: hidden;
    display: inline-block;
}

.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* OVERLAY */

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}


/* TITLE */

.overlay h2 {
    font-size: 28px;
    font-weight: normal;
}


/* BUTTON */

.overlay button {
    color: white;
    border: 2px solid white;
    padding: 10px 25px;
    font-size: 11px;
    cursor: pointer;
}

.overlay button:hover {
    color: black;
}


/* FOOTER */

footer {
    padding: 25px 55px;
    font-size: 14px;
    color: #555;
}

footer span {
    color: #20c997;
}
</style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Photon
        </div>

        <nav>

            <ul class="nav-links">

                <li>
                    <a href="#" class="active">HOME</a>
                </li>

                <li class="dropdown">

                    <a href="#">
                        GALLERY <span>⌄</span>
                    </a>

                    <ul class="dropdown-menu">

                        <li><a href="#">Nature</a></li>
                        <li><a href="#">Portrait</a></li>
                        <li><a href="#">People</a></li>
                        <li><a href="#">Architecture</a></li>
                        <li><a href="#">Animals</a></li>
                        <li><a href="#">Sports</a></li>
                        <li><a href="#">Travel</a></li>

                    </ul>

                </li>

                <li>
                    <a href="#">SERVICES</a>
                </li>

                <li>
                    <a href="#">ABOUT</a>
                </li>

                <li>
                    <a href="#">CONTACT</a>
                </li>

            </ul>

        </nav>


        <!-- SOCIAL ICONS -->

        <div class="social">

            <a href="#">f</a>
            <a href="#">♥</a>
            <a href="#">◎</a>
            <a href="#">▶</a>

        </div>

    </header>


    <!-- GALLERY -->

    <main class="gallery">

        <div class="photo-card nature">

            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b"
                alt="Nature">

            <div class="overlay">

                <h2>Nature</h2>

                <button>
                    MORE PHOTOS
                </button>

            </div>

        </div>


        <div class="photo-card portrait">

            <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce"
                alt="Portrait">

            <div class="overlay">

                <h2>Portrait</h2>

                <button>
                    MORE PHOTOS
                </button>

            </div>

        </div>


        <div class="photo-card people">

            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac"
                alt="People">

            <div class="overlay">

                <h2>People</h2>

                <button>
                    MORE PHOTOS
                </button>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        Copyright © 2018 All rights reserved |
        This template is made with ♡ by
        <span>Colorlib</span>

    </footer>


   

</body>

</html>
