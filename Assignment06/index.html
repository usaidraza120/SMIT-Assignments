<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
</head>

<body>

    <form>

        <label>First Name</label>
        <input type="text">

        <br><br>

        <label>Last Name</label>
        <input type="text">

        <br><br>

        <label>Email</label>
        <input type="email">

        <br><br>

        <label>Password</label>
        <input type="password">

        <br><br>

        <label>Gender</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <label>Country</label>
        <select>
            <option>Pakistan</option>
            <option>India</option>
            <option>USA</option>
        </select>

        <br><br>

        <label>Message</label>
        <textarea rows="5" cols="30"></textarea>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
