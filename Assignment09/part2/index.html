<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            width: 1000px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left {
            width: 50%;
        }

        .logo {
            color: #1877f2;
            font-size: 46px;
            font-weight: bold;
        }

        .text {
            font-size: 20px;
            width: 450px;
        }

        .right {
            width: 380px;
            background: white;
            padding: 15px;
            border-radius: 7px;
            text-align: center;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .login {
            width: 100%;
            height: 45px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            display: block;
            color: #1877f2;
            font-size: 12px;
            text-decoration: none;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
        }

        .create {
            background: #42b72a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="left">

            <div class="logo">
                facebook
            </div>

            <div class="text">
                Connect with friends and the world
                around you on Facebook.
            </div>

        </div>


        <div class="right">

            <input type="text" placeholder="Email or phone number">

            <input type="password" placeholder="Password">

            <button class="login">
                Login
            </button>

            <a href="#" class="forgot">
                Forgot password?
            </a>

            <hr>

            <button class="create">
                Create new account
            </button>

        </div>

    </div>

</body>
</html>
